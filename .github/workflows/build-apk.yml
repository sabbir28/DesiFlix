name: Build & Publish Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'DesiFlix Android Release'

jobs:
  build-apk:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🟩 Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: ⚡ Build Web Assets (Vite)
        run: npm run build

      - name: 📱 Add & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🔑 Decode Android Keystore (If Secret Present)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          else
            echo "No keystore secret provided. Proceeding with standard build."
          fi

      - name: 🏗️ Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🖊️ Sign Release APK (If Keystore Provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BUILD_TOOLS_VERSION: '34.0.0'
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: rnicoll/action-sign-app@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 🏷️ Rename APK Artifact
        run: |
          mkdir -p output_apk
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output_apk/DesiFlix-${{ github.ref_name || 'latest' }}.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output_apk/DesiFlix-${{ github.ref_name || 'latest' }}-unsigned.apk
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/DesiFlix-${{ github.ref_name || 'latest' }}-debug.apk
          else
            find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/ \;
          fi

      - name: 📤 Upload Build Artifact (Every Push)
        uses: actions/upload-artifact@v4
        with:
          name: DesiFlix-APK-Build-${{ github.sha }}
          path: output_apk/*.apk

      - name: 🚀 Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: DesiFlix Android App ${{ github.ref_name || 'Build' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body: |
            ## 🎬 DesiFlix Android APK Release
            
            This Android APK application was automatically compiled and published using **Node.js, Capacitor & GitHub Actions**.
            
            ### 📦 Download Instructions:
            1. Download `DesiFlix-${{ github.ref_name || 'latest' }}.apk` attached below.
            2. Transfer to your Android device and tap to install!
            
            ---
            *Automated CI/CD build powered by Node.js & GitHub Actions.*
          files: |
            output_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

